<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BEMO · نموذج مراجعة الصفحة الرئيسية</title><link rel="stylesheet" href="design.css"></head>
<body>

<div class="nav-shell"><nav class="container category-nav"><details id="allCategories"><summary><span data-icon="menu"></span><span data-t="allCategories"></span></summary><div id="categoryFlyout"></div></details><div id="topCategories"></div><a class="nav-offer" id="offersLink" href="search.html?offer=1" data-t="deals"></a><a href="../" class="merchant-link" data-t="merchant"></a></nav></div>
<main class="container">

<section class="fast-categories" aria-label="Categories" id="fastCategories"></section>
