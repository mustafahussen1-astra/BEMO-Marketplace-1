<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>إكمال تسجيل الدخول — BEMO</title>
  <link rel="stylesheet" href="account.css">
</head>
<body data-account-view="callback">
  <header class="account-header"><div class="account-container header-row"><a class="brand" href="index.html" aria-label="BEMO">BEMO<span aria-hidden="true">●</span></a><button id="languageButton" class="language-button" type="button" lang="en">English</button></div></header>
  <main class="callback-main">
    <section class="account-card callback-card" aria-labelledby="callbackTitle">
      <span id="callbackSpinner" class="spinner" aria-hidden="true"></span>
      <h1 id="callbackTitle" data-i18n="callbackTitle">نُكمل تسجيل دخولك</h1>
      <p id="callbackMessage" class="section-copy" role="status" aria-live="polite" data-i18n="callbackCopy">لحظات، ونعيدك إلى حسابك.</p>
      <div id="callbackError" class="message error-message" role="alert" tabindex="-1" hidden></div>
      <a id="callbackReturn" class="primary-button" href="account.html" data-route="account.html" data-i18n="returnToAccount" hidden>العودة إلى الحساب</a>
    </section>
  </main>
  <noscript><p class="noscript-note">يلزم تشغيل JavaScript لإكمال تسجيل الدخول. JavaScript is required to finish signing in.</p></noscript>
  <script src="vendor/supabase-2.118.0.js"></script>
  <script src="backend-config.js"></script>
  <script src="account-session.js"></script>
  <script src="account-page.js"></script>
</body>
</html>
